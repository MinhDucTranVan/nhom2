<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Quản lý sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>

  <body class="bg-light">
    <div class="container mt-5">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h3>Quản lý sách</h3>
        </div>

        <div class="card-body">
          <h5>Thêm sách mới</h5>

          <form action="/them-sach" method="POST">
            <div class="mb-3">
              <label class="form-label">Tên sách</label>
              <input type="text" name="title" class="form-control" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Tác giả</label>
              <input type="text" name="author" class="form-control" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Giá sách</label>
              <input type="number" name="price" class="form-control" min="0" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Số lượng</label>
              <input type="number" name="quantity" class="form-control" min="0" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Danh mục</label>
              <select name="category_id" class="form-select" required>
                <option value="">-- Chọn danh mục --</option>

                {% for dm in danh_muc %}
                  <option value="{{ dm.id }}">{{ dm.name }}</option>
                {% endfor %}
              </select>
            </div>

            <button type="submit" class="btn btn-primary">Thêm sách</button>
          </form>

          <hr />

          <h5>Danh sách sách</h5>

          <table class="table table-bordered table-striped">
            <thead class="table-primary">
              <tr>
                <th>Mã sách</th>
                <th>Tên sách</th>
                <th>Tác giả</th>
                <th>Giá</th>
                <th>Số lượng</th>
                <th>Danh mục</th>
                <th>Thao tác</th>
              </tr>
            </thead>

            <tbody>
              {% for sach in ds_sach %}
                <tr>
                  <td>{{ sach.id }}</td>
                  <td>{{ sach.title }}</td>
                  <td>{{ sach.author }}</td>
                  <td>{{ sach.price }}</td>
                  <td>{{ sach.quantity }}</td>
                  <td>{{ sach.category.name }}</td>
                  <td>
                    <a href="{{ url_for('sua_sach', id=sach.id) }}" class="btn btn-warning btn-sm">Sửa</a>

                    <form action="{{ url_for('xoa_sach', id=sach.id) }}" method="POST" class="d-inline">
                      <button type="submit" class="btn btn-danger btn-sm">Xóa</button>
                    </form>
                  </td>
                </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
