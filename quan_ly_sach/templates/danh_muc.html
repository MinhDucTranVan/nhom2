<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Quản lý danh mục sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h3 class="mb-0">Danh sách danh mục sách</h3>
        </div>

        <div class="card-body">
          <form action="/them-danh-muc" method="POST" class="mb-4">
            <div class="mb-3">
              <label class="form-label">Tên danh mục</label>
              <input type="text" name="name" class="form-control" placeholder="Nhập tên danh mục" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Mô tả</label>
              <textarea name="description" class="form-control" placeholder="Nhập mô tả"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Thêm danh mục</button>
          </form>

          <table class="table table-bordered table-striped">
            <thead class="table-primary">
              <tr>
                <th>Mã danh mục</th>
                <th>Tên danh mục</th>
                <th>Mô tả</th>
                <th>Thao tác</th>
              </tr>
            </thead>

            <tbody>
              {% for dm in danh_muc %}
                <tr>
                  <td>{{ dm.id }}</td>
                  <td>{{ dm.name }}</td>
                  <td>{{ dm.description }}</td>
                  <td>
                    <a href="{{ url_for('sua_danh_muc', id=dm.id) }}" class="btn btn-warning btn-sm">Sửa</a>
                  </td>

                  <form action="{{ url_for('xoa_danh_muc', id=dm.id) }}" method="POST" class="d-inline">
                    <button type="submit" class="btn btn-danger btn-sm">Xóa</button>
                  </form>
                </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
