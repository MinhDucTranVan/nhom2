<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard quản lý sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>

  <body class="bg-light">
    <div class="container mt-5">
      <h2 class="text-center mb-4">DASHBOARD QUẢN LÝ SÁCH</h2>

      <div class="row">
        <div class="col-md-6">
          <div class="card text-center shadow">
            <div class="card-body">
              <h5 class="card-title">Danh mục sách</h5>
              <h2 class="text-primary">{{ so_danh_muc }}</h2>
              <p class="card-text">Tổng số danh mục hiện có</p>
              <a href="{{ url_for('danh_muc') }}" class="btn btn-primary">Quản lý danh mục</a>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card text-center shadow">
            <div class="card-body">
              <h5 class="card-title">Sách</h5>
              <h2 class="text-success">{{ so_sach }}</h2>
              <p class="card-text">Tổng số sách hiện có</p>
              <a href="{{ url_for('sach') }}" class="btn btn-success">Quản lý sách</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
