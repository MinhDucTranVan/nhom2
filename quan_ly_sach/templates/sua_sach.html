<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Sửa thông tin sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>

  <body class="bg-light">
    <div class="container mt-5">
      <div class="card shadow">
        <div class="card-header bg-warning">
          <h3 class="mb-0">Sửa thông tin sách</h3>
        </div>

        <div class="card-body">
          <form method="POST">
            <div class="mb-3">
              <label class="form-label">Tên sách</label>
              <input type="text" name="title" class="form-control" value="{{ sach.title }}" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Tác giả</label>
              <input type="text" name="author" class="form-control" value="{{ sach.author }}" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Giá sách</label>
              <input type="number" name="price" class="form-control" value="{{ sach.price }}" min="0" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Số lượng</label>
              <input type="number" name="quantity" class="form-control" value="{{ sach.quantity }}" min="0" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Danh mục</label>

              <select name="category_id" class="form-select" required>
                {% for dm in danh_muc %}
                  {% if dm.id == sach.category_id %}
                    <option value="{{ dm.id }}" selected>{{ dm.name }}</option>
                  {% else %}
                    <option value="{{ dm.id }}">{{ dm.name }}</option>
                  {% endif %}
                {% endfor %}
              </select>
            </div>

            <button type="submit" class="btn btn-warning">Lưu thay đổi</button>

            <a href="{{ url_for('sach') }}" class="btn btn-secondary">Quay lại</a>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
