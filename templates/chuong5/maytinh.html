
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy tính cơ bản</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #dbeafe, #f5f3ff);
            min-height: 100vh;
        }

        .calculator {
            max-width: 500px;
            margin: 60px auto 25px;
            border: none;
            border-radius: 18px;
            overflow: hidden;
        }

        .form-control, .form-select {
            border-radius: 10px;
            padding: 12px;
        }

        .btn {
            border-radius: 10px;
            padding: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card calculator shadow-lg">

        <div class="card-header bg-primary text-white text-center py-4">
            <h3 class="mb-0">Máy tính cơ bản</h3>
        </div>

        <div class="card-body p-4">

            <form method="POST" action="{{ url_for('maytinh') }}">

                <!-- Số thứ nhất -->
                <div class="mb-3">
                    <label class="form-label fw-bold">
                        Số thứ nhất (a)
                    </label>

                    <input type="text"
                           name="a"
                           class="form-control {% if loi_a %}is-invalid{% endif %}"
                           value="{{ a }}">

                    {% if loi_a %}
                    <div class="invalid-feedback">
                        {{ loi_a }}
                    </div>
                    {% endif %}
                </div>

                <!-- Phép toán -->
                <div class="mb-3">
                    <label class="form-label fw-bold">
                        Phép toán (op)
                    </label>

                    <select name="op" class="form-select">

                        <option value="+"
                            {% if op == '+' %}selected{% endif %}>
                            + Cộng
                        </option>

                        <option value="-"
                            {% if op == '-' %}selected{% endif %}>
                            - Trừ
                        </option>

                        <option value="*"
                            {% if op == '*' %}selected{% endif %}>
                            × Nhân
                        </option>

                        <option value="/"
                            {% if op == '/' %}selected{% endif %}>
                            ÷ Chia
                        </option>

                    </select>
                </div>

                <!-- Số thứ hai -->
                <div class="mb-3">
                    <label class="form-label fw-bold">
                        Số thứ hai (b)
                    </label>

                    <input type="text"
                           name="b"
                           class="form-control {% if loi_b %}is-invalid{% endif %}"
                           value="{{ b }}">

                    {% if loi_b %}
                    <div class="invalid-feedback">
                        {{ loi_b }}
                    </div>
                    {% endif %}
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary fw-bold">
                        Tính
                    </button>
                </div>

            </form>

            <!-- Kết quả -->
            {% if ketqua %}
            <div class="alert alert-success text-center mt-4 mb-0">
                <h5>Kết quả</h5>
                <h4 class="fw-bold mb-0">{{ ketqua }}</h4>
            </div>
            {% endif %}

        </div>
    </div>

    <div class="text-center mb-5">
        <a href="{{ url_for('trangchu') }}"
           class="btn btn-outline-primary">
            ← Quay lại Chương 5
        </a>
    </div>

</div>

</body>
</html>
