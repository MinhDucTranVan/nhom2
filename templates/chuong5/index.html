
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chương 5 - Form và xử lý dữ liệu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body {
            background: #fff0f6;
        }
        .header {
            background: #db2777;
            color: white;
            padding: 45px 15px;
            text-align: center;
        }
        .exercise-card {
            border: 1px solid #fbcfe8;
            border-radius: 15px;
            transition: 0.2s;
        }
        .exercise-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px #f9a8d455;
        }
        .btn-pink {
            background: #db2777;
            color: white;
        }
        .btn-pink:hover {
            background: #be185d;
            color: white;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>CHƯƠNG 5</h1>
    <h4>Form và xử lý dữ liệu người dùng</h4>
</div>

<div class="container py-5">
    <div class="row g-4">

        <div class="col-md-4">
            <div class="card exercise-card h-100 shadow-sm">
                <div class="card-body text-center p-4">
                    <h1>🧮</h1>
                    <h4>Máy tính cơ bản</h4>
                    <p>Thực hiện các phép tính +, -, *, /</p>
                    <a href="{{ url_for('maytinh') }}"
                       class="btn btn-pink w-100">
                        Mở bài 1
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card exercise-card h-100 shadow-sm">
                <div class="card-body text-center p-4">
                    <h1>🎓</h1>
                    <h4>Tính điểm học phần</h4>
                    <p>Tính điểm và xếp loại A, B, C, D, F</p>
                    <a href="{{ url_for('tinhdiem') }}"
                       class="btn btn-pink w-100">
                        Mở bài 2
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card exercise-card h-100 shadow-sm">
                <div class="card-body text-center p-4">
                    <h1>⚖️</h1>
                    <h4>Tính chỉ số BMI</h4>
                    <p>Tính BMI và phân loại thể trạng</p>
                    <a href="{{ url_for('bmi') }}"
                       class="btn btn-pink w-100">
                        Mở bài 3
                    </a>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
