
{% extends "base.html" %}

{% block title %}Liên hệ{% endblock %}

{% block content %}

<div class="container mt-5">
    <div class="card shadow-sm p-4">

        <h1>Thông tin liên hệ</h1>

        <p>
            <strong>Tên quán:</strong>
            {{ shop.name }}
        </p>

        <p>
            <strong>Địa chỉ:</strong>
            {{ shop.address }}
        </p>

        <p>
            <strong>Điện thoại:</strong>
            {{ shop.phone }}
        </p>

    </div>
</div>

{% endblock %}
